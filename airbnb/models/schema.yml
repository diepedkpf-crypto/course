version: 2

models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.

    data_tests:
      - minimum_row_count:
          arguments:
            min_rows: 1000000
    columns:
      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - unique
          - not_null
      
      - name: host_id
        description: Foreign key to the dim_hosts_cleansed table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      
      - name: room_type
        description: Type of room being listed
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed_minimum_nights") }}'
        data_tests:
          - positive_values

    
  
  - name: dim_hosts_cleansed

    config:
      contract:
        enforced: true

        
    columns:
      - name: host_id
        description: Primary key for the host
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique
          #- not_null

      - name: host_name
        description: Name of the host
        data_type: string
        constraints:
          - type: not_null
        # data_tests:
        #  - not_null

      - name: is_superhost
        description: Whether the host is a superhost or not
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: updated_at
        description: Timestamp of the last update to the host's information
        data_type: timestamp
        
      - name: created_at
        description: Timestamp of when the host was created
        data_type: timestamp